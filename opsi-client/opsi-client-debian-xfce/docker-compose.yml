volumes:
 home:
    driver: local

networks:
  opsi-server_default:
    external: true
    name: opsi-server_default

services:
  opsi-client-debian-xfce:
    # build: .    # use for building the image locally
    image: opsi-client-debian-xfce:4.2-experimental   # use for pulling the remote image OR when the image was built with ./opsi-client.sh build before
    volumes:
      - home:/home
    ports:
      - "2222:22"
      - "3390:3389"
    hostname: opsi-client-debian-xfce
    domainname: domain.tld
    # Needed for cifs / webdav mount
    privileged: true
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    entrypoint: ["/entrypoint.sh"]

